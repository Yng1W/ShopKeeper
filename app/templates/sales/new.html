{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;">{{ t('Record Sale') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label for="item_id">{{ t('Item') }}</label>
            <select id="item_id" name="item_id" class="form-control" required>
                <option value="">{{ t('Select Item') }}</option>
                {% for item in items %}
                <option value="{{ item.item_id }}">
                    {{ t(item.name) }} ({{ item.quantity_in_stock }} {{ t(item.unit_type) }} {{ t('in stock') }}) - {{ item.selling_price }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="client_id">{{ t('Client (Optional)') }}</label>
            <select id="client_id" name="client_id" class="form-control">
                <option value="">{{ t('Walk-in (No Client)') }}</option>
                {% for client in clients %}
                <option value="{{ client.client_id }}">{{ client.name }}</option>
                {% endfor %}
            </select>
            <small class="item-meta">{{ t('Link this sale to a client to invoice them later.') }}</small>
        </div>
        
        <div class="form-group">
            <label for="quantity_sold">{{ t('Quantity') }}</label>
            <input type="number" id="quantity_sold" name="quantity_sold" class="form-control" min="1" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            {{ t('Record Sale') }}
        </button>
    </form>
</div>
{% endblock %}
