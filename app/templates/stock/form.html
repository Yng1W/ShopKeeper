{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 640px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;">{{ t('Edit Item') if item else t('Add Item') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label for="name">{{ t('Name') }}</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ item.name if item else '' }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">{{ t('Category') }}</label>
                <input type="text" id="category" name="category" class="form-control" value="{{ item.category if item else '' }}">
            </div>

            <div class="form-group">
                <label for="unit_type">{{ t('Unit Type') }}</label>
                <input type="text" id="unit_type" name="unit_type" class="form-control" value="{{ item.unit_type if item else 'piece' }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cost_price">{{ t('Cost Price') }}</label>
                <input type="number" step="0.01" id="cost_price" name="cost_price" class="form-control" value="{{ item.cost_price if item else '' }}" required>
            </div>

            <div class="form-group">
                <label for="selling_price">{{ t('Selling Price') }}</label>
                <input type="number" step="0.01" id="selling_price" name="selling_price" class="form-control" value="{{ item.selling_price if item else '' }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="quantity_in_stock">{{ t('Quantity in Stock') }}</label>
                <input type="number" id="quantity_in_stock" name="quantity_in_stock" class="form-control" value="{{ item.quantity_in_stock if item else '0' }}" required>
            </div>

            <div class="form-group">
                <label for="reorder_threshold">{{ t('Reorder Threshold') }}</label>
                <input type="number" id="reorder_threshold" name="reorder_threshold" class="form-control" value="{{ item.reorder_threshold if item else '5' }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            {{ t('Save') }}
        </button>
    </form>
</div>
{% endblock %}
